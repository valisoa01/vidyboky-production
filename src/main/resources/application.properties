spring.config.import=optional:file.env[.properties]

spring.datasource.url=jdbc:${NEON_DB_URL}
spring.datasource.username=${NEON_DB_USERNAME}
spring.datasource.password=${NEON_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
aws.eventBridge.bus=local-dummy-bus
books.api.url=https://openlibrary.org/api/books


aws.s3.bucket=${AWS_S3_BUCKET}
