name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AWS_REGION: eu-west-3
      SPRING_PROFILES_ACTIVE: test
      # Utiliser les secrets pour la base de données
      NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
      NEON_DB_USERNAME: ${{ secrets.NEON_DB_USERNAME }}
      NEON_DB_PASSWORD: ${{ secrets.NEON_DB_PASSWORD }}

    steps:
      - uses: actions/checkout@v4.1.6

      - uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - run: chmod +x gradlew
      - run: chmod +x .shell/publish_gen_to_maven_local.sh

      # Afficher les variables pour debug (sans les valeurs sensibles)
      - name: Debug environment
        run: |
          echo "AWS_REGION: $AWS_REGION"
          echo "SPRING_PROFILES_ACTIVE: $SPRING_PROFILES_ACTIVE"
          echo "NEON_DB_URL exists: ${{ secrets.NEON_DB_URL != '' }}"

      - name: Run tests
        run: |
          ./gradlew test --info --stacktrace

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4.1.6
      - uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - run: chmod +x format.sh
      - run: ./format.sh && git diff --exit-code